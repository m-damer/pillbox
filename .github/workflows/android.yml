name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, screenshots and debug APK
        run: ./gradlew testDebugUnitTest assembleDebug -Proborazzi.test.record=true --stacktrace 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Show first errors in the run summary
        if: failure()
        run: |
          grep -E "^e: |What went wrong|FAILED|Caused by|error:" -A3 build.log | head -40 | while IFS= read -r l; do echo "::error::${l}"; done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pillbox-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/outputs/roborazzi/
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
