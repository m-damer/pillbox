name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'To publish a signed release, type the version number, for example 1.0.1. Leave empty for a normal test build.'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event.inputs.release_version == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, screenshots and debug APK
        run: ./gradlew testDebugUnitTest assembleDebug -Proborazzi.test.record=true --stacktrace 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Show first errors in the run summary
        if: failure()
        run: |
          grep -E "^e: |What went wrong|FAILED|Caused by|error:" -A3 build.log | head -40 | while IFS= read -r l; do echo "::error::${l}"; done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pillbox-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/outputs/roborazzi/
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  # Signed release: run this workflow by hand from the Actions tab and type a version number.
  # Needs four repository secrets: PILLBOX_KEYSTORE_BASE64, PILLBOX_STORE_PASSWORD, PILLBOX_KEY_ALIAS, PILLBOX_KEY_PASSWORD.
  release:
    if: ${{ github.event.inputs.release_version != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Version from the input
        id: v
        run: |
          TAG="${{ github.event.inputs.release_version }}"
          TAG="${TAG#v}"
          IFS=. read -r MA MI PA <<< "$TAG"
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "code=$((MA*10000 + MI*100 + ${PA:-0}))" >> "$GITHUB_OUTPUT"
      - name: Restore the signing key
        env:
          KEYSTORE_B64: ${{ secrets.PILLBOX_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Secret PILLBOX_KEYSTORE_BASE64 is missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pillbox-release.jks"
      - name: Build the signed APK
        env:
          PILLBOX_KEYSTORE: ${{ runner.temp }}/pillbox-release.jks
          PILLBOX_STORE_PASSWORD: ${{ secrets.PILLBOX_STORE_PASSWORD }}
          PILLBOX_KEY_ALIAS: ${{ secrets.PILLBOX_KEY_ALIAS }}
          PILLBOX_KEY_PASSWORD: ${{ secrets.PILLBOX_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -Ppillbox.versionName=${{ steps.v.outputs.name }} -Ppillbox.versionCode=${{ steps.v.outputs.code }}
      - name: Name the files and show the signing fingerprint
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" "PillBox-${{ steps.v.outputs.name }}.apk"
          sha256sum "PillBox-${{ steps.v.outputs.name }}.apk" > "PillBox-${{ steps.v.outputs.name }}.apk.sha256"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "PillBox-${{ steps.v.outputs.name }}.apk" | grep -E "SHA-(1|256) digest" | while IFS= read -r l; do echo "::notice::${l}"; done
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.name }}" --target "$GITHUB_SHA" "PillBox-${{ steps.v.outputs.name }}.apk" "PillBox-${{ steps.v.outputs.name }}.apk.sha256" \
            --title "Pill Box ${{ steps.v.outputs.name }}" --generate-notes
